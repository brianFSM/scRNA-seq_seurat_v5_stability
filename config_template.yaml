project:
  analyst-name: Your Name
  project-name: 'Test'
  project-description: "ToDo"
  organism: mouse            # 'mouse' or 'human' - sets mito/ribo/hb/Y gene patterns
  # Samples are a proper YAML sequence. Dashes/quotes are not needed;
  # names with spaces or dashes are handled correctly.
  samples:
    - Sample1
    - Sample2
    - Sample3
    - Sample4

data:
  parent_directory_path: path/to/CellRanger
  # Shared output root. Part 1 writes its object, QC tables, and raw QC figures
  # here; each run's outputs go in a subdirectory named by analysis:run_name.
  rds-file-path: ./results

analysis:
  node_type: analytics
  # Name of this run's output subdirectory under data:rds-file-path. Change it
  # to keep alternate runs (e.g. different QC cutoffs) side by side - each run
  # directory is self-contained and holds its own objects, tables, figures,
  # marker genes, and PDFs. Must be a single directory name, not a path.
  run_name: default

  part1:
    part1_rds_save_filename: _0_raw_seurat_object.RDS
    part1_report_tables_filename: part1_tables_for_report.RData
    # Suffixes part 1's own output filenames, for genuine part-1 variants
    # (e.g. SoupX on vs off). NOT for QC-cutoff variants - use run_name for
    # those. A separator is added if you omit one ('alt' and '_alt' both work).
    part1_suffix: ''
    generate_metrics_tables: 'TRUE'
    run_SoupX: 'TRUE'          # ambient RNA correction; needs the raw matrix
    ggplot_dir: ggplot

  part2:
    ############################################################################
    # QC cutoffs - set these AFTER reading the part 1 PDF
    ############################################################################
    mito_ceiling: 5            # max % mitochondrial
    RNA_count_floor: 500
    RNA_count_ceiling: 25000
    feature_count_floor: 300
    feature_count_ceiling: 6000
    rbc_ceiling: 100           # max % hemoglobin
    # ribo_floor filters out cells BELOW this percent ribosomal content.
    # This is non-standard and can remove legitimate low-ribo cell types, so it
    # defaults to 0 (off). Raise it only if you have a specific reason to.
    ribo_floor: 0

    ############################################################################
    # Clustering resolution
    ############################################################################
    # Resolution grid swept for subsample stability. A broad, standard Louvain
    # range by default; narrow or shift it to match expected biological
    # granularity.
    cluster_res_min: 0.1
    cluster_res_max: 1.0
    cluster_res_step: 0.1
    # Part 2a scores each resolution in the grid for subsample stability (how
    # reproducibly it recovers the same clusters under resampling), then picks
    # the finest resolution clearing a threshold derived from the data itself.
    # More reps = steadier estimate but more compute (reps x grid FindClusters).
    stability_reps: 5
    stability_subsample_frac: 0.8
    # 'auto' uses the resolution part 2a proposed (recorded in the integrated
    # object). Set a number to override; part 2a will not overwrite your value.
    # Nothing in the pipeline writes back to this file - it is input only.
    clustering_resolution_value: auto

    ############################################################################
    # Output filenames (relative to the run directory)
    ############################################################################
    merged_seurat_obj_file: _1_seurat5_obj_merged.RDS
    integrated_seurat_obj_file: _2_seurat5_obj_integrated.RDS
    clustered_seurat_obj_file: _3_seurat5_obj_clustered.RDS
    part2_report_tables_filename: part2_tables_for_report.RData
    marker_gene_dir: marker_genes

    ############################################################################
    # Toggles
    ############################################################################
    run_doubletFinder: 'TRUE'  # per-sample doublet detection before merging
    # Which marker figures part 2b draws per cluster: any of feat, dot, vln.
    # 'vln' is off by default - the dot plot answers "is this gene
    # cluster-specific" more compactly, but violins show within-cluster
    # distribution, so add it when you need to see bimodality.
    marker_plot_types:
      - feat
      - dot

